name: Build Morphe Chess Assistant

on:
  push:
    branches:
      - morphe-chess-assistant
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Build Morphe bundle
        working-directory: MorpheChessAssistant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --no-daemon

      - name: Upload .mpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-assistant-morphe-mpp
          path: MorpheChessAssistant/patches/build/libs/*.mpp
          if-no-files-found: error
