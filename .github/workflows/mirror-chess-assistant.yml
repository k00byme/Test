name: Mirror Chess Assistant

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-chess-assistant.yml"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch source and copy complete working tree
        env:
          SOURCE_REPOSITORY: k00byme/Revangetest
          SOURCE_BRANCH: morphe-chess-assistant
          DESTINATION_BRANCH: chess-assistant-mirror
        run: |
          git remote add source "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --no-tags source "refs/heads/${SOURCE_BRANCH}:refs/remotes/source/${SOURCE_BRANCH}"
          git switch --orphan mirror-copy "refs/remotes/source/${SOURCE_BRANCH}"
          git rm -r .github/workflows
          git -c user.name="Repository mirror" -c user.email="actions@users.noreply.github.com" commit -m "Copy Chess Assistant repository snapshot"
          git push origin "HEAD:refs/heads/${DESTINATION_BRANCH}" --force
