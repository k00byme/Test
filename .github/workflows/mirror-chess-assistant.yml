name: Mirror Chess Assistant

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-chess-assistant.yml"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source into an isolated Git repository
        env:
          SOURCE_REPOSITORY: k00byme/Revangetest
          SOURCE_BRANCH: morphe-chess-assistant
          DESTINATION_BRANCH: chess-assistant-mirror
          DESTINATION_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chess-assistant-mirror"
          cd "$RUNNER_TEMP/chess-assistant-mirror"
          git init
          git remote add source "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --no-tags source "refs/heads/${SOURCE_BRANCH}"
          git checkout --orphan mirror-copy FETCH_HEAD
          git rm -r .github/workflows
          git config user.name "Repository mirror"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Copy Chess Assistant repository snapshot"
          git remote add destination "https://x-access-token:${GITHUB_TOKEN}@github.com/${DESTINATION_REPOSITORY}.git"
          git push destination "HEAD:refs/heads/${DESTINATION_BRANCH}" --force
